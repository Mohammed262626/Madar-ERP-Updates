<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيل مدار ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-2xl w-full text-center space-y-8 bg-slate-900/50 p-10 rounded-3xl border border-slate-800 backdrop-blur-sm">
        
        <!-- الأيقونة العلوية -->
        <div class="w-20 h-20 bg-indigo-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 22h20"/><path d="M17 2v20"/><path d="M7 2v20"/><path d="M14 15h3"/><path d="M14 11h3"/><path d="M14 7h3"/><path d="M7 15h4"/><path d="M7 11h4"/><path d="M7 7h4"/>
            </svg>
        </div>

        <!-- العناوين -->
        <div class="space-y-4">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight">
                نظام <span class="gradient-text">مدار ERP</span>
            </h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-lg mx-auto leading-relaxed">
                النظام الأقوى والأسهل لإدارة مخزونك، مبيعاتك، وحساباتك بكل دقة واحترافية.
            </p>
        </div>

        <!-- الأزرار -->
        <div class="pt-6">
            <div class="flex flex-col md:flex-row items-center justify-center gap-4">
                <!-- زر التحميل المباشر -->
                <button onclick="downloadLatest()" id="downloadBtn" class="glow-btn flex-1 inline-flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-6 rounded-xl text-lg w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
                    </svg>
                    <span id="btnText">تنزيل النسخة</span>
                </button>

                <!-- زر التجربة الحية -->
                <a href="https://inventory-manager-uluh.onrender.com/" target="_blank" class="glow-btn flex-1 inline-flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-6 rounded-xl text-lg w-full border border-slate-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
                    </svg>
                    تجربة النظام حياً
                </a>
            </div>
            
            <!-- نص أحدث إصدار -->
            <p id="versionText" class="mt-4 text-sm text-slate-400 font-semibold uppercase tracking-wider">
                جاري البحث عن أحدث إصدار...
            </p>
        </div>
    </div>

    <!-- كود الجافاسكربت -->
    <script>
        let latestExeUrl = null;

        // دالة تعمل فور فتح الصفحة لجلب رقم الإصدار والرابط
        async function fetchLatestVersion() {
            try {
                const response = await fetch('https://api.github.com/repos/Mohammed262626/Madar-ERP-Updates/releases/latest');
                const data = await response.json();
                
                // تحديث النص ليعرض رقم الإصدار 
                document.getElementById('versionText').innerText = `أحدث إصدار متوفر: ${data.tag_name || data.name}`;
                
                // تخزين رابط التحميل لاستخدامه عند الضغط على الزر
                const exeAsset = data.assets.find(asset => asset.name.endsWith('.exe'));
                if (exeAsset) {
                    latestExeUrl = exeAsset.browser_download_url;
                }
            } catch (error) {
                document.getElementById('versionText').innerText = "جاهز للتحميل";
            }
        }

        // تشغيل الدالة فوراً
        fetchLatestVersion();

        // دالة التحميل المباشر عند الضغط على الزر
        function downloadLatest() {
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerText;
            
            if (latestExeUrl) {
                btnText.innerText = "بدأ التحميل!";
                window.location.href = latestExeUrl;
                
                setTimeout(() => {
                    btnText.innerText = originalText;
                }, 3000);
            } else {
                // بديل احتياطي لو لم يجد الرابط
                btnText.innerText = "جاري التوجيه...";
                window.location.href = 'https://github.com/Mohammed262626/Madar-ERP-Updates/releases/latest';
            }
        }
    </script>
</body>
</html>

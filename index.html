<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيل مدار ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50 text-slate-900">
    
    <div class="max-w-2xl w-full text-center space-y-8 bg-white p-10 rounded-none border border-slate-300">
        
        <!-- الأيقونة العلوية -->
        <div class="w-20 h-20 bg-slate-900 rounded-none mx-auto flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 22h20"/><path d="M17 2v20"/><path d="M7 2v20"/><path d="M14 15h3"/><path d="M14 11h3"/><path d="M14 7h3"/><path d="M7 15h4"/><path d="M7 11h4"/><path d="M7 7h4"/>
            </svg>
        </div>

        <!-- العناوين -->
        <div class="space-y-4">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight text-slate-900">
                نظام مدار ERP
            </h1>
            <p class="text-slate-600 text-lg md:text-xl max-w-lg mx-auto leading-relaxed font-bold">
                النظام الأقوى والأسهل لإدارة مخزونك، مبيعاتك، وحساباتك بكل دقة واحترافية.
            </p>
        </div>

        <!-- الأزرار -->
        <div class="pt-6 space-y-4">
            <div class="flex flex-col md:flex-row items-center justify-center gap-4">
                <!-- زر التحميل المباشر -->
                <button onclick="downloadLatest()" id="downloadBtn" class="flex-1 inline-flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-6 rounded-none text-lg w-full transition-colors border border-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
                    </svg>
                    <span id="btnText">تنزيل النسخة</span>
                </button>

                <!-- زر التجربة الحية -->
                <a href="https://madar.up.railway.app/" target="_blank" class="flex-1 inline-flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-900 font-bold py-4 px-6 rounded-none text-lg w-full border border-slate-300 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
                    </svg>
                    تجربة النظام حياً
                </a>
            </div>
            
            <!-- زر واتساب -->
            <a href="https://wa.me/249967827496" target="_blank" class="inline-flex items-center justify-center gap-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-3 px-6 rounded-none w-full border border-emerald-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                تواصل عبر واتساب
            </a>
            
            <!-- نص أحدث إصدار -->
            <p id="versionText" class="mt-4 text-sm text-slate-500 font-semibold uppercase tracking-wider">
                جاري البحث عن أحدث إصدار...
            </p>
        </div>
    </div>

    <!-- كود الجافاسكربت -->
    <script>
        let latestExeUrl = null;

        async function fetchLatestVersion() {
            try {
                const response = await fetch('https://api.github.com/repos/Mohammed262626/Madar-ERP-Updates/releases/latest');
                const data = await response.json();
                
                document.getElementById('versionText').innerText = `أحدث إصدار متوفر: ${data.tag_name || data.name}`;
                
                const exeAsset = data.assets.find(asset => asset.name.endsWith('.exe'));
                if (exeAsset) {
                    latestExeUrl = exeAsset.browser_download_url;
                }
            } catch (error) {
                document.getElementById('versionText').innerText = "جاهز للتحميل";
            }
        }

        fetchLatestVersion();

        function downloadLatest() {
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerText;
            
            if (latestExeUrl) {
                btnText.innerText = "بدأ التحميل!";
                window.location.href = latestExeUrl;
                
                setTimeout(() => {
                    btnText.innerText = originalText;
                }, 3000);
            } else {
                btnText.innerText = "جاري التوجيه...";
                window.location.href = 'https://github.com/Mohammed262626/Madar-ERP-Updates/releases/latest';
            }
        }
    </script>
</body>
</html>
